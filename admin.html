<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Submissions · London Favorites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Caveat:wght@600&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap">
<style>
:root{--paper:#FFF8E7;--berry:#930500;--powder:#95BBEA;--pink:#f5dcd5;--ink:#3a1410;--muted:#7a5650;--line:#ecd9c9;--card:#fffdf7}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif;background-image:linear-gradient(#f3e6cf 1px,transparent 1px),linear-gradient(90deg,#f3e6cf 1px,transparent 1px);background-size:26px 26px}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(36px,6vw,56px);line-height:1;color:var(--berry);margin:0}
.hand{font-family:Caveat,cursive;font-size:22px;color:var(--berry)}
.eyebrow{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border-radius:18px;padding:28px;box-shadow:0 18px 40px rgba(80,10,5,.12);text-align:center}
input{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin:14px 0 10px}
button{font:500 14px "DM Sans",sans-serif;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:var(--berry);color:var(--paper)}
button.ghost{background:transparent;color:var(--berry);border:1.5px solid var(--berry)}
button.blue{background:var(--powder);color:var(--ink)}
.err{color:var(--berry);min-height:1.5em;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{background:var(--card);color:var(--berry);border:1.5px solid var(--line)}
.tabs button.on{background:var(--berry);color:var(--paper);border-color:var(--berry)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 8px 22px rgba(80,10,5,.1);display:flex;flex-direction:column;gap:8px;min-width:0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.photos a:only-child{grid-column:1/-1}
.photos img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;display:block;background:var(--pink)}
.photos a:only-child img{aspect-ratio:4/3}
.card h3{margin:0;font-family:"Instrument Serif",serif;font-weight:400;font-size:24px;color:var(--berry);overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.why{margin:0;font-size:14px;overflow-wrap:anywhere}
.badge{align-self:flex-start;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--pink);color:var(--berry)}
.badge.approved{background:var(--berry);color:var(--paper)}.badge.hidden{background:#e7e1d6;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.acts button{padding:8px 12px;font-size:13px}
.empty{text-align:center;padding:50px 0;color:var(--muted)}
.notes{display:grid;gap:14px}
.note{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;background:var(--card);border-radius:14px;padding:12px;box-shadow:0 8px 22px rgba(80,10,5,.1);align-items:start}
.note img{width:96px;height:96px;object-fit:cover;border-radius:10px;display:block}
.note h3{margin:0 0 2px;font-family:"Instrument Serif",serif;font-weight:400;font-size:24px;color:var(--berry)}
.note textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;resize:vertical;min-height:80px;margin:8px 0}
.note .row{display:flex;gap:10px;align-items:center}
.note .ok{font-family:Caveat,cursive;font-size:20px;color:var(--berry)}
@media (max-width:520px){.note{grid-template-columns:64px minmax(0,1fr)}.note img{width:64px;height:64px}}
</style></head>
<body><div class="wrap">
<div class="login" id="login">
  <span class="eyebrow">London Favorites</span>
  <h1>Hi lulwah</h1>
  <p class="hand">type your passcode to see what people sent</p>
  <form id="lf"><input id="pass" type="password" placeholder="Passcode" autocomplete="current-password" required><div class="err" id="err"></div><button>Open</button></form>
</div>
<main id="app" hidden>
  <header><div><span class="eyebrow">Only you can see this page</span><h1>What people sent</h1></div>
    <div style="display:flex;gap:8px"><button class="ghost" id="refresh">Refresh</button><button class="ghost" id="out">Log out</button></div></header>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</main>
</div>
<script>
const SB='https://bvpruzwymudrsgfloidc.supabase.co',SBK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2cHJ1end5bXVkcnNnZmxvaWRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNzQyNjksImV4cCI6MjEwOTc1MDI2OX0.EhDhKxqjLDka1480JdJ6zPK3HAQToZ7dCIY8eNIP7fY';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rpc=(fn,body)=>fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SBK,Authorization:'Bearer '+SBK,'Content-Type':'application/json'},body:JSON.stringify(body)});
let pass='',rows=[],tab='notes';
try{pass=localStorage.getItem('lf-pass')||''}catch(e){}
const tabsDef=[['notes','My spot notes'],['new','New'],['approved','On the site'],['hidden','Hidden'],['all','All']];
const SPOTS=[["Big Ben", "Westminster", "big-ben"], ["Tower Bridge", "Tower Hill", "tower-bridge"], ["Piccadilly Circus", "West End", "piccadilly"], ["The London Eye at night", "South Bank", "london-eye"], ["V&A Museum", "South Kensington", "va"], ["Harrods", "Knightsbridge", "harrods"], ["Shad Thames", "Bermondsey", "shad-thames"], ["The Queen's Walk at sunset", "Near Tower Bridge", "queens-walk"], ["The Serpentine", "Hyde Park", "serpentine"], ["Holland Park", "Kensington", "holland-park"], ["Old Bond Street", "Mayfair", "old-bond-street"], ["HMV", "Oxford Street", "hmv"], ["Flabelus", "Shoe shopping", "flabelus"], ["Superdrug", "London", "superdrug"], ["The Black Dog", "Vauxhall", "black-dog"], ["Jenki Matcha", "Selfridges", "jenki"], ["Qinwan", "Ya marhaba coffee", "qinwan"], ["Blank Street Coffee", "London", "blank-street"], ["Flat Iron", "London", "flat-iron"], ["Best bagels in town", "Utopia Bagels", "bagels"], ["Holburne Museum", "Great Pulteney Street view", "holburne"], ["Lemonade by the river", "Parade Gardens", "lemonade"], ["River Avon", "Pulteney Bridge", "river-avon"], ["Green walks", "Bath", "bath-trees"]];
let notes={};
async function load(){const r=await rpc('admin_list',{pass});if(!r.ok)throw new Error('bad');rows=await r.json();try{const n=await fetch(SB+'/rest/v1/spot_notes?select=spot_key,note',{headers:{apikey:SBK,Authorization:'Bearer '+SBK}});if(n.ok)(await n.json()).forEach(x=>notes[x.spot_key]=x.note);}catch(e){}render();}
function render(){
  document.getElementById('tabs').innerHTML=tabsDef.map(([k,l])=>{const n=k==='notes'?'':' ('+(k==='all'?rows.length:rows.filter(x=>x.status===k).length)+')';return `<button data-tab="${k}" class="${k===tab?'on':''}">${l}${n}</button>`}).join('');
  if(tab==='notes'){document.getElementById('grid').className='notes';document.getElementById('grid').innerHTML=SPOTS.map(([n,a,k])=>`<div class="note"><img src="images/${k}.jpg" alt=""><div><h3>${esc(n)}</h3><div class="meta">${esc(a)}</div><textarea data-k="${k}" maxlength="1500" placeholder="What do you love about ${esc(n)}?">${esc(notes[k]||'')}</textarea><div class="row"><button data-save="${k}">Save</button><span class="ok" id="ok-${k}"></span></div></div></div>`).join('');return;}
  document.getElementById('grid').className='grid';
  const list=rows.filter(x=>tab==='all'||x.status===tab);
  document.getElementById('grid').innerHTML=list.length?list.map(s=>{
    const d=new Date(s.created_at).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const ph=s.photos.length?`<div class="photos">${s.photos.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy"></a>`).join('')}</div>`:'';
    const a=[];if(s.status!=='approved')a.push(`<button data-act="approved" data-id="${s.id}">Show on site</button>`);if(s.status!=='hidden')a.push(`<button class="ghost" data-act="hidden" data-id="${s.id}">Hide</button>`);if(s.status!=='new')a.push(`<button class="blue" data-act="new" data-id="${s.id}">Back to new</button>`);
    return `<article class="card"><span class="badge ${s.status}">${s.status==='approved'?'on the site':s.status}</span>${ph}<h3>${esc(s.place||(s.kind==='photo'?'Photos':'A spot'))}</h3><div class="meta">${s.kind==='spot'?'Spot':'Photos'}${s.city?' · '+esc(s.city):''}${s.area?' · '+esc(s.area):''}${s.spot_type?' · '+esc(s.spot_type):''}<br>from ${esc(s.name||'someone')} · ${d}</div>${s.why?`<p class="why">${esc(s.why)}</p>`:''}<div class="acts">${a.join('')}</div></article>`;
  }).join(''):`<p class="empty hand">Nothing here yet.</p>`;
}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();}};
document.getElementById('grid').onclick=async e=>{const sv=e.target.closest('[data-save]');if(sv){const k=sv.dataset.save,t=document.querySelector(`textarea[data-k="${k}"]`).value;sv.disabled=true;const ok=document.getElementById('ok-'+k);ok.textContent='saving…';const r=await rpc('admin_save_note',{pass,key:k,body:t});sv.disabled=false;if(r.ok){notes[k]=t;ok.textContent='saved ♡';}else ok.textContent='didn’t save, try again';return;}
  const b=e.target.closest('[data-act]');if(!b)return;b.disabled=true;const r=await rpc('admin_set_status',{pass,sub_id:b.dataset.id,new_status:b.dataset.act});if(r.ok){rows.find(x=>x.id===b.dataset.id).status=b.dataset.act;render();}else{b.disabled=false;alert('That did not work, please try again.');}};
document.getElementById('refresh').onclick=()=>load().catch(()=>alert('Could not load. Check your internet.'));
document.getElementById('out').onclick=()=>{try{localStorage.removeItem('lf-pass')}catch(e){}location.reload();};
function show(){document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;}
document.getElementById('lf').onsubmit=async e=>{e.preventDefault();pass=document.getElementById('pass').value.trim();document.getElementById('err').textContent='';try{await load();try{localStorage.setItem('lf-pass',pass)}catch(e){}show();}catch(err){document.getElementById('err').textContent='That passcode isn’t right.';}};
if(pass)load().then(show).catch(()=>{});
</script>
</body></html>
